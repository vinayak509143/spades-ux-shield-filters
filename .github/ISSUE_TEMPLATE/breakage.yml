name: Dark pattern or broken page
description: Report a dark pattern that is still visible, or a page the extension breaks
title: "[dark pattern / broken page] "
labels:
  - breakage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Spades UX-Shield. **Do not** paste full URLs with query strings, tokens, or personal data.
        Fields below are pre-filled when you use **Report Dark Pattern & Broken Page** in the extension popup.
  - type: input
    id: site
    attributes:
      label: Site (eTLD+1)
      description: Registrable domain (e.g. `www.shop.example.com` → `example.com`)
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Path template
      description: Anonymized path only (no query string or hash; numeric segments as `:id`)
  - type: input
    id: version
    attributes:
      label: Extension version
  - type: textarea
    id: rules
    attributes:
      label: Matched rule IDs (FNV-1a)
      description: Comma-separated rule hashes recorded for the tab
  - type: dropdown
    id: kind
    attributes:
      label: What are you reporting?
      options:
        - Dark pattern still visible
        - Something legitimate broke
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What should we look at?
      description: A dark pattern that is still visible, or what the extension broke (checkout, login, scroll, payment).
    validations:
      required: true
