name: Broken page
description: Report a site where Spades UX-Shield breaks legitimate functionality
title: "[breakage] "
labels:
  - breakage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Spades UX-Shield. **Do not** paste full URLs with query strings, tokens, or personal data.
        Fields below are pre-filled when you use **Report broken page** in the extension popup.
  - type: input
    id: site
    attributes:
      label: Site (eTLD+1)
      description: Registrable domain (e.g. `www.shop.example.com` → `example.com`)
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Path template
      description: Anonymized path only (no query string or hash; numeric segments as `:id`)
  - type: input
    id: version
    attributes:
      label: Extension version
  - type: textarea
    id: rules
    attributes:
      label: Matched rule IDs (FNV-1a)
      description: Comma-separated rule hashes recorded for the tab
  - type: textarea
    id: description
    attributes:
      label: What broke?
      description: Checkout, login, scroll lock, payment, etc.
    validations:
      required: true
